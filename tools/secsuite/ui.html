<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 安全測試（G6）</title>
<style>

.brand{font-size:19px;font-weight:700;color:var(--brand);align-self:center}

.topbar nav a{font-size:15px;border-bottom:3px solid transparent;padding:22px 0 19px;color:#333842}
.topbar nav a:hover{text-decoration:none;color:var(--brand)}
.topbar nav a[aria-current=page]{color:var(--brand);font-weight:700;border-bottom-color:var(--brand)}
.asof{margin-left:auto;align-self:center;font-size:13px;color:var(--muted)}
main{padding:32px 40px 64px;max-width:1380px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{margin:4px 0 0;font-size:28px;line-height:1.3}h2{margin:0 0 12px;font-size:18px}h3{margin:18px 0 6px;font-size:15px}
.eyebrow{font-size:13px;color:var(--muted)}

.note{font-size:13px;color:var(--muted)}

:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

.big{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:34px;line-height:1.2}
.bar{position:relative;height:14px;background:var(--line);border-radius:2px;margin:10px 0 4px}
.bar .ci{position:absolute;top:4px;height:6px;background:#9fb3cf;border-radius:2px}
.bar .pt{position:absolute;top:0;width:4px;height:14px;background:var(--brand);margin-left:-2px;border-radius:1px}
.bar .th{position:absolute;top:-4px;width:0;height:22px;border-left:2px dashed var(--danger)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

.tablewrap{overflow-x:auto}
ul.tight{margin:4px 0;padding-left:20px}
@media (max-width:720px){.topbar{padding:0 16px;gap:14px}main{padding:20px 16px 48px}.kv{grid-template-columns:1fr}.topbar nav{gap:18px}}
</style>

      S.live ? $("div", { class: "rowflex", style: "margin-top:16px" },
        $("button", { class: "link", onclick: () => { dl.filter((d) => !d.ready).forEach((d) => PICK.add(d.id)); render(); }, text: "選取所有尚未下載的" }),
        $("button", { class: "link", onclick: () => { dl.filter((d) => !d.ready && !SENSITIVE.has(d.risk)).forEach((d) => PICK.add(d.id)); render(); }, text: "只選低風險的" }),
        $("span", { class: "mono", text: `已選 ${PICK.size} 個 · ${kb(total)}` }),
        $("label", {}, $("input", { type: "checkbox", checked: AGREE, onchange: (e) => { AGREE = e.target.checked; render(); } }), " 我已閱讀各資料集的大小、授權與內容風險，同意下載"),
        $("button", { class: "btn", disabled: !PICK.size || !AGREE || S.fetchBusy, onclick: async () => { try { await api("/api/fetch", { ids: [...PICK], approved: true }); PICK.clear(); AGREE = false; S.fetchBusy = true; render(); poll(); } catch (e) { S.fetchLog = [e.message]; render(); } }, text: S.fetchBusy ? "下載中…" : "下載已選取的資料集" })) : null,
      (S.fetchLog || []).length ? $("pre", { class: "note mono", style: "margin:12px 0 0;white-space:pre-wrap", text: S.fetchLog.join("\n") }) : null)];
}
load().catch((e) => { document.getElementById("app").replaceChildren($("section", { class: "card" }, $("p", { text: "載入失敗：" + e.message }))); });
</script>
