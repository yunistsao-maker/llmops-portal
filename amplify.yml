version: 1
frontend:
  phases:
    preBuild:
      commands:
        - python3 tools/validate_data.py
    build:
      commands:
        # site/ is the prebuilt app; this adds data/, runs/, config/ and generates data/manifest.json
        - node tools/build_site.mjs
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
