version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --prefix web
    build:
      commands:
        # sync-data copies ../data into web/public/data, then tsc + vite build
        - npm run build --prefix web
  artifacts:
    baseDirectory: web/dist
    files:
      - '**/*'
  cache:
    paths:
      - web/node_modules/**/*
