# Amplify build for the llm-ops-frontend branch: the new static UI (frontend/), served from dist-frontend/.
# Pure static hosting — no Amplify backend, no server-side code; the page only reads data/ui.json from the same site.
# (main keeps its own amplify.yml for the previous portal, built by tools/build_site.mjs into dist/.)
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --no-audit --no-fund
        # the research data (old-UI schema) must be valid and the radar current
        - node tools/validate.mjs
        - python3 tools/validate_data.py
        - python3 tools/build_radar.py --check
    build:
      commands:
        # the new-UI view model must be generated from the data above and match schema/ui.schema.json
        - python3 tools/build_ui_data.py --check
        - node tools/validate_ui.mjs
        - python3 tools/build_frontend.py
  artifacts:
    baseDirectory: dist-frontend
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
